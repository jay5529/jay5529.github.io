  <!-- ==============================================================
       JAVASCRIPT LOGIC
       ============================================================== -->
  <script>
    /* -------------------------------------------------------------
       STATE MANAGEMENT
       ------------------------------------------------------------- */
    const STORAGE_KEY_USERS = "1D1A_USERS_DATA";
    const STORAGE_KEY_SESSION = "1D1A_CURRENT_USER";
    const STORAGE_KEY_ALBUMS = "1D1A_ALBUMS_DATA_";
    const STORAGE_KEY_SHELF_NAMES = "1D1A_SHELF_NAMES_";

    let currentUser = null;
    let albumsList = [];
    let currentShelfIndex = 0;
    let selectedStarRating = 5;
    let uploadedCoverBase64 = null;
    let viewingAlbumId = null;
    let isAddingAlbum = false;
    let toastTimer = null;

    // 로컬 타임존(한국 표준시 등) 기준 오늘 날짜 YYYY-MM-DD 반환
    function getTodayLocalDateStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    // ISO 타임스탬프를 로컬 날짜 YYYY-MM-DD로 변환
    function getLocalDateFromIso(isoStr) {
      if (!isoStr) return "";
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return "";
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    // 하루에 한 개 이상 앨범 추가 제한 체크 (오늘 이미 기록했는지 확인)
    function hasRecordedAlbumToday() {
      const today = getTodayLocalDateStr();
      return albumsList.some(album => {
        const createdLocalDate = getLocalDateFromIso(album.createdAt);
        return createdLocalDate === today || album.date === today;
      });
    }

    // XML 이스케이프 헬퍼
    function escapeXml(unsafe) {
      if (!unsafe) return "";
      return String(unsafe).replace(/[<>&'"]/g, function (c) {
        switch (c) {
          case '<': return '&lt;';
          case '>': return '&gt;';
          case '&': return '&amp;';
          case '\'': return '&apos;';
          case '"': return '&quot;';
        }
      });
    }

    // 두 번째 사진과 100% 동일한 정방형 화이트 바이닐 기본 앨범 커버 생성
    function getWhiteDefaultCoverSvg(title, artist) {
      const displayTitle = (title || "Album").slice(0, 18);
      const displayArtist = (artist || "Artist").slice(0, 20);
      const safeTitle = escapeXml(displayTitle);
      const safeArtist = escapeXml(displayArtist);

      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
        <rect width="300" height="300" fill="#FFFFFF"/>
        <rect x="1" y="1" width="298" height="298" rx="8" fill="none" stroke="#E6E9F0" stroke-width="1.5"/>
        <!-- 3개의 섬세한 동심원 (두 번째 사진과 완벽 일치) -->
        <circle cx="150" cy="135" r="96" fill="none" stroke="#F1F5F9" stroke-width="2.2"/>
        <circle cx="150" cy="135" r="64" fill="none" stroke="#E2E8F0" stroke-width="1.8"/>
        <circle cx="150" cy="135" r="32" fill="none" stroke="#CBD5E1" stroke-width="1.4"/>
        <!-- 중심점 도트 -->
        <circle cx="150" cy="135" r="5.5" fill="#8FA2C3"/>
        <!-- 앨범 타이틀 (중심점 아래에 단정하게 배치) -->
        <text x="150" y="194" font-family="-apple-system,BlinkMacSystemFont,Pretendard,sans-serif" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">${safeTitle}</text>
        <!-- 아티스트명 -->
        <text x="150" y="214" font-family="-apple-system,BlinkMacSystemFont,Pretendard,sans-serif" font-weight="500" font-size="10.5" fill="#8FA2C3" text-anchor="middle">${safeArtist}</text>
      </svg>`;

      return `data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(svg)))}`;
    }

    // Audio SFX using Web Audio API (외부 파일 종속성 없음)
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      playSlideIn() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.36);
        } catch (e) { }
      }
      playSlotSnap() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(180, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(450, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.16);
        } catch (e) { }
      }
    }
    const sfx = new SoundFX();

    /* -------------------------------------------------------------
       INITIALIZATION
       ------------------------------------------------------------- */
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      checkAuthSession();

      const todayStr = getTodayLocalDateStr();
      const dateInput = document.getElementById("form-listen-date");
      if (dateInput) {
        dateInput.value = todayStr;
        dateInput.max = todayStr;
      }
    });

    /* -------------------------------------------------------------
       AUTH CONTROLLER
       ------------------------------------------------------------- */
    function checkAuthSession() {
      const savedSession = localStorage.getItem(STORAGE_KEY_SESSION);
      if (savedSession) {
        currentUser = JSON.parse(savedSession);
        showMainScreen();
      } else {
        showAuthScreen();
      }
    }

    function showAuthScreen() {
      document.getElementById("auth-screen").classList.add("active");
      document.getElementById("main-screen").classList.remove("active");
      document.getElementById("header-user-panel").style.display = "none";
      toggleAuthMode("login");
    }

    function showMainScreen() {
      document.getElementById("auth-screen").classList.remove("active");
      document.getElementById("main-screen").classList.add("active");
      document.getElementById("header-user-panel").style.display = "flex";

      updateHeaderAvatarDisplay();
      loadUserAlbums();
      renderBookshelf();
      lucide.createIcons();
    }

    function toggleAuthMode(mode) {
      const loginCard = document.getElementById("login-card-view");
      const signupCard = document.getElementById("signup-card-view");
      if (mode === "signup") {
        loginCard.style.display = "none";
        signupCard.style.display = "block";
      } else {
        loginCard.style.display = "block";
        signupCard.style.display = "none";
      }
      lucide.createIcons();
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const id = document.getElementById("login-id").value.trim();
      const pw = document.getElementById("login-password").value;

      const users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS) || "{}");
      if (users[id] && users[id].password === pw) {
        currentUser = users[id];
        localStorage.setItem(STORAGE_KEY_SESSION, JSON.stringify(currentUser));
        showToast(`${currentUser.nickname || currentUser.id}님, 환영합니다!`);
        showMainScreen();
      } else {
        alert("아이디 또는 비밀번호가 일치하지 않습니다.");
      }
    }

    /* 회원가입: 아이디 중복 방지 & 닉네임 중복 방지 */
    function handleSignupSubmit(e) {
      e.preventDefault();
      const id = document.getElementById("signup-id").value.trim();
      const pw = document.getElementById("signup-password").value;
      const nickname = document.getElementById("signup-nickname").value.trim();

      if (!id || !pw || !nickname) {
        alert("모든 필드를 입력해주세요.");
        return;
      }

      const users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS) || "{}");

      // 1) 아이디 중복 체크
      if (users[id]) {
        alert("이미 사용 중인 아이디입니다. 다른 아이디를 입력해주세요.");
        return;
      }

      // 2) 닉네임 중복 체크
      const nicknameExists = Object.values(users).some(
        u => u.nickname && u.nickname.toLowerCase() === nickname.toLowerCase()
      );
      if (nicknameExists) {
        alert("이미 사용 중인 닉네임입니다. 다른 닉네임을 입력해주세요.");
        return;
      }

      const newUser = { id, password: pw, nickname, avatarUrl: null };
      users[id] = newUser;
      localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(users));

      currentUser = newUser;
      localStorage.setItem(STORAGE_KEY_SESSION, JSON.stringify(currentUser));
      showToast("회원가입이 완료되었습니다!");
      showMainScreen();
    }

    function handleLogout() {
      if (confirm("로그아웃 하시겠습니까?")) {
        localStorage.removeItem(STORAGE_KEY_SESSION);
        currentUser = null;
        albumsList = [];
        isAddingAlbum = false;
        showAuthScreen();
        showToast("로그아웃 되었습니다.");
      }
    }

    function navigateToHome() {
      if (currentUser) {
        showMainScreen();
      } else {
        showAuthScreen();
      }
    }

    /* -------------------------------------------------------------
       프로필 설정 (사진 설정 및 수정, 닉네임 변경)
       ------------------------------------------------------------- */
    let tempAvatarBase64 = null;

    function openProfileModal() {
      if (!currentUser) return;
      tempAvatarBase64 = currentUser.avatarUrl || null;

      document.getElementById("profile-modal-id").textContent = currentUser.id;
      document.getElementById("profile-modal-nickname").value = currentUser.nickname || "";

      updateProfileModalAvatarDisplay(tempAvatarBase64, currentUser.nickname);
      document.getElementById("profile-modal").classList.add("active");
      lucide.createIcons();
    }

    function closeProfileModal() {
      document.getElementById("profile-modal").classList.remove("active");
      tempAvatarBase64 = null;
    }

    function triggerProfilePhotoUpload() {
      document.getElementById("profile-avatar-file-input").click();
    }

    function handleProfilePhotoChange(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        alert("이미지 파일만 등록 가능합니다.");
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        tempAvatarBase64 = event.target.result;
        const currentNick = document.getElementById("profile-modal-nickname").value.trim() || currentUser.nickname;
        updateProfileModalAvatarDisplay(tempAvatarBase64, currentNick);
      };
      reader.readAsDataURL(file);
    }

    function updateProfileModalAvatarDisplay(avatarUrl, nickname) {
      const img = document.getElementById("profile-modal-avatar-img");
      const initial = document.getElementById("profile-modal-avatar-initial");

      if (avatarUrl) {
        img.src = avatarUrl;
        img.style.display = "block";
        initial.style.display = "none";
      } else {
        img.style.display = "none";
        initial.style.display = "block";
        initial.textContent = (nickname || "U").slice(0, 1).toUpperCase();
      }
    }

    function updateHeaderAvatarDisplay() {
      if (!currentUser) return;
      const img = document.getElementById("header-avatar-img");
      const initial = document.getElementById("header-avatar-initial");

      if (currentUser.avatarUrl) {
        img.src = currentUser.avatarUrl;
        img.style.display = "block";
        initial.style.display = "none";
      } else {
        img.style.display = "none";
        initial.style.display = "block";
        initial.textContent = (currentUser.nickname || currentUser.id || "U").slice(0, 1).toUpperCase();
      }
    }

    function handleProfileSubmit(e) {
      e.preventDefault();
      const newNickname = document.getElementById("profile-modal-nickname").value.trim();

      if (!newNickname) {
        alert("닉네임을 입력해주세요.");
        return;
      }

      const users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS) || "{}");

      // 본인 제외 다른 계정과 닉네임 중복 체크
      const nicknameConflict = Object.entries(users).some(
        ([id, u]) => id !== currentUser.id && u.nickname && u.nickname.toLowerCase() === newNickname.toLowerCase()
      );
      if (nicknameConflict) {
        alert("이미 다른 사용자가 사용 중인 닉네임입니다.");
        return;
      }

      currentUser.nickname = newNickname;
      currentUser.avatarUrl = tempAvatarBase64;

      users[currentUser.id] = currentUser;
      localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(users));
      localStorage.setItem(STORAGE_KEY_SESSION, JSON.stringify(currentUser));

      updateHeaderAvatarDisplay();
      closeProfileModal();
      showToast("프로필이 성공적으로 변경되었습니다.");
    }

    /* -------------------------------------------------------------
       책장 이름 커스텀 설정
       ------------------------------------------------------------- */
    function getShelfName(shelfIdx) {
      if (!currentUser) return `책장 #${shelfIdx + 1}`;
      const customNames = JSON.parse(localStorage.getItem(STORAGE_KEY_SHELF_NAMES + currentUser.id) || "{}");
      return customNames[shelfIdx] || `책장 #${shelfIdx + 1}`;
    }

    function enableShelfNameEdit() {
      const label = document.getElementById("current-shelf-label");
      const input = document.getElementById("shelf-name-input");
      input.value = label.textContent;
      label.style.display = "none";
      input.style.display = "inline-block";
      input.focus();
      input.select();
    }

    function saveShelfName() {
      const label = document.getElementById("current-shelf-label");
      const input = document.getElementById("shelf-name-input");
      if (input.style.display === "none") return;

      const newName = input.value.trim() || `책장 #${currentShelfIndex + 1}`;
      label.textContent = newName;
      label.style.display = "inline-block";
      input.style.display = "none";

      if (currentUser) {
        const customNames = JSON.parse(localStorage.getItem(STORAGE_KEY_SHELF_NAMES + currentUser.id) || "{}");
        customNames[currentShelfIndex] = newName;
        localStorage.setItem(STORAGE_KEY_SHELF_NAMES + currentUser.id, JSON.stringify(customNames));
      }
      showToast(`책장 이름이 '${newName}'(으)로 변경되었습니다.`);
    }

    function handleShelfNameKeydown(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        saveShelfName();
      } else if (e.key === "Escape") {
        const label = document.getElementById("current-shelf-label");
        const input = document.getElementById("shelf-name-input");
        label.style.display = "inline-block";
        input.style.display = "none";
      }
    }

    /* -------------------------------------------------------------
       ALBUMS DATA MANAGEMENT
       ------------------------------------------------------------- */
    function loadUserAlbums() {
      if (!currentUser) return;
      const key = STORAGE_KEY_ALBUMS + currentUser.id;
      const data = localStorage.getItem(key);
      albumsList = data ? JSON.parse(data) : [];

      // 기존에 첫 번째 사진처럼 깨져서 저장되어 있던 SVG coverUrl을 두 번째 사진 스타일로 자동 갱신
      let updated = false;
      albumsList.forEach(album => {
        if (album.coverUrl && (album.coverUrl.includes("%20") || album.coverUrl.includes("data:image/svg+xml;utf8"))) {
          album.coverUrl = getWhiteDefaultCoverSvg(album.title, album.artist);
          updated = true;
        }
      });
      if (updated) {
        localStorage.setItem(key, JSON.stringify(albumsList));
      }

      updateStats();
    }

    function saveUserAlbums() {
      if (!currentUser) return;
      const key = STORAGE_KEY_ALBUMS + currentUser.id;
      localStorage.setItem(key, JSON.stringify(albumsList));
      updateStats();
    }

    function updateStats() {
      const totalCount = albumsList.length;
      document.getElementById("stat-total-albums").textContent = totalCount;

      const currentShelfAlbumsCount = albumsList.slice(currentShelfIndex * 30, (currentShelfIndex + 1) * 30).length;
      document.getElementById("shelf-badge-counter").textContent = `${currentShelfAlbumsCount} / 30장`;
      document.getElementById("current-shelf-label").textContent = getShelfName(currentShelfIndex);

      const totalShelves = Math.max(1, Math.ceil(albumsList.length / 30));
      document.getElementById("btn-prev-shelf").disabled = currentShelfIndex === 0;
      document.getElementById("btn-next-shelf").disabled = currentShelfIndex >= totalShelves - 1;

      const limitReached = hasRecordedAlbumToday();
      const fabBtn = document.getElementById("btn-fab-add");
      const sampleBtn = document.getElementById("btn-add-sample");
      if (fabBtn) {
        fabBtn.classList.toggle("daily-limit-reached", limitReached);
        fabBtn.setAttribute("aria-disabled", limitReached ? "true" : "false");
        fabBtn.title = limitReached ? "오늘의 앨범은 이미 기록되었습니다 (1일 1앨범 제한)" : "오늘 들은 앨범 기록";
      }
      if (sampleBtn) {
        sampleBtn.classList.toggle("daily-limit-reached", limitReached);
        sampleBtn.setAttribute("aria-disabled", limitReached ? "true" : "false");
        sampleBtn.title = limitReached ? "오늘의 앨범은 이미 기록되었습니다 (1일 1앨범 제한)" : "샘플 명반 추가";
      }
    }

    /* -------------------------------------------------------------
       BOOKSHELF RENDERER (책장 렌더링)
       상하 세 칸(3 rows), 한 칸에 10장씩 (총 30장)
       앞면으로 꽂히도록 디자인 + +(숫자) 칸 전부 삭제
       ------------------------------------------------------------- */
    function renderBookshelf() {
      const wrapper = document.getElementById("bookshelf-slider-wrapper");
      wrapper.innerHTML = "";

      const totalAlbums = albumsList.length;
      let totalShelves = Math.floor(totalAlbums / 30) + 1;

      if (currentShelfIndex >= totalShelves) {
        currentShelfIndex = totalShelves - 1;
      }

      for (let shelfIdx = 0; shelfIdx < totalShelves; shelfIdx++) {
        const shelfUnit = document.createElement("div");
        shelfUnit.className = "bookshelf-unit";
        shelfUnit.id = `bookshelf-unit-${shelfIdx}`;

        const rowsContainer = document.createElement("div");
        rowsContainer.className = "shelf-rows-container";

        // 상하 3칸 (Row 0, 1, 2)
        for (let rowIdx = 0; rowIdx < 3; rowIdx++) {
          const rowWrapper = document.createElement("div");
          rowWrapper.className = "shelf-row-wrapper";

          // 10 Slots Grid (1단/2단/3단 문구 삭제, 10장이 한 선반 안에 깔끔하게 정렬)
          const slotsGrid = document.createElement("div");
          slotsGrid.className = "shelf-slots-grid";
          slotsGrid.id = `shelf-grid-${shelfIdx}-${rowIdx}`;

          // 1칸당 10장 슬롯
          for (let slotIdx = 0; slotIdx < 10; slotIdx++) {
            const absoluteAlbumIndex = (shelfIdx * 30) + (rowIdx * 10) + slotIdx;
            const albumData = albumsList[absoluteAlbumIndex];

            if (albumData) {
              const lpElem = createLpElement(albumData, absoluteAlbumIndex);
              lpElem.style.setProperty("--slot-idx", slotIdx);
              slotsGrid.appendChild(lpElem);
            } else {
              // +(숫자) 칸 전부 삭제된 깨끗한 빈 선반 슬롯
              const emptySlot = document.createElement("div");
              emptySlot.className = "lp-slot-empty";
              emptySlot.id = `slot-${shelfIdx}-${rowIdx}-${slotIdx}`;
              emptySlot.style.setProperty("--slot-idx", slotIdx);
              emptySlot.title = "비어있는 칸 (클릭하여 앨범 기록)";
              emptySlot.onclick = () => openAddAlbumModal();
              slotsGrid.appendChild(emptySlot);
            }
          }

          const plank = document.createElement("div");
          plank.className = "shelf-plank";

          rowWrapper.appendChild(slotsGrid);
          rowWrapper.appendChild(plank);
          rowsContainer.appendChild(rowWrapper);
        }

        shelfUnit.appendChild(rowsContainer);
        wrapper.appendChild(shelfUnit);
      }

      wrapper.style.transform = `translateX(-${currentShelfIndex * 100}%)`;
      updateStats();
      lucide.createIcons();
    }

    /* -------------------------------------------------------------
       LP ELEMENT FACTORY (앞면 1:1 정사각형으로 꽂히도록 디자인)
       ------------------------------------------------------------- */
    function createLpElement(album, index) {
      const item = document.createElement("div");
      item.className = "lp-shelf-item";
      item.id = `lp-item-${album.id}`;
      item.setAttribute("data-album-id", album.id);

      // 왼쪽에서 오른쪽으로 자연스러운 슬롯 레이어링 (LP판이 다음 LP 뒤로 겹침)
      const slotIdx = index % 10;
      item.style.zIndex = slotIdx + 2;

      const starText = "★ " + Number(album.rating).toFixed(1);

      item.innerHTML = `
        <div class="lp-disk-peek"></div>
        <div class="lp-jacket-wrapper">
          <img class="lp-jacket-cover" src="${album.coverUrl}" alt="${escapeHtml(album.title)}" />
          <div class="lp-badge-rating">${starText}</div>
        </div>
      `;

      item.addEventListener("click", (e) => {
        if (!item.hasAttribute("data-dragged")) {
          openDetailModal(album.id);
        }
      });

      // 앞으로 살짝 기울어지는 드래그 틸트 인터랙션
      setupDragTiltInteraction(item);

      return item;
    }

    /* ★ 드래그 시: 살짝 확대 되면서 LP가 살짝 꺼내지는 애니메이션 */
    function setupDragTiltInteraction(element) {
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let currentY = 0;
      const disk = element.querySelector(".lp-disk-peek");

      const onMouseDown = (e) => {
        isDragging = true;
        const point = e.touches && e.touches.length > 0 ? e.touches[0] : e;
        startX = point.clientX;
        startY = point.clientY;
        element.removeAttribute("data-dragged");
        element.classList.add("tilted");
      };

      const onMouseMove = (e) => {
        if (!isDragging) return;
        const point = e.touches && e.touches.length > 0 ? e.touches[0] : e;
        currentX = point.clientX;
        currentY = point.clientY;
        const deltaX = currentX - startX;
        const deltaY = startY - currentY; // 위쪽으로 드래그
        const dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        if (dist > 8) {
          element.setAttribute("data-dragged", "true");
        }

        // 살짝 확대되는 스케일 (1.08 ~ 1.15)
        const scaleVal = Math.min(1.16, 1.08 + dist * 0.001);
        const liftY = Math.min(14, 6 + deltaY * 0.15);
        element.style.transform = `translateY(-${liftY}px) scale(${scaleVal})`;

        // LP판이 자켓 밖으로(우측/우상단) 스르륵 살짝 꺼내지는 거리 및 회전
        if (disk) {
          const isMobile = window.innerWidth <= 540;
          const basePeek = isMobile ? 14 : 24;
          const maxPeek = isMobile ? 28 : 44;
          const peekX = Math.min(maxPeek, Math.max(basePeek * 0.8, basePeek + deltaX * 0.35 + deltaY * 0.25));
          const peekY = Math.max(-12, Math.min(0, -4 - deltaY * 0.12));
          const peekRot = Math.min(65, 35 + dist * 0.3);
          disk.style.transform = `translate(${peekX}px, ${peekY}px) rotate(${peekRot}deg)`;
        }
      };

      const onMouseUp = () => {
        if (isDragging) {
          isDragging = false;
          element.style.transform = "";
          if (disk) disk.style.transform = "";
          setTimeout(() => {
            element.classList.remove("tilted");
            setTimeout(() => element.removeAttribute("data-dragged"), 50);
          }, 180);
        }
      };

      element.addEventListener("mousedown", onMouseDown);
      window.addEventListener("mousemove", onMouseMove);
      window.addEventListener("mouseup", onMouseUp);

      element.addEventListener("touchstart", onMouseDown, { passive: true });
      window.addEventListener("touchmove", onMouseMove, { passive: true });
      window.addEventListener("touchend", onMouseUp);
    }

    /* -------------------------------------------------------------
       SHELF SLIDE CONTROLS (슬라이드로 다음 책장 이동)
       ------------------------------------------------------------- */
    function slideBookshelf(direction) {
      const totalShelves = Math.max(1, Math.ceil(albumsList.length / 30));
      const targetIndex = currentShelfIndex + direction;

      if (targetIndex >= 0 && targetIndex < totalShelves) {
        currentShelfIndex = targetIndex;
        const wrapper = document.getElementById("bookshelf-slider-wrapper");
        wrapper.style.transform = `translateX(-${currentShelfIndex * 100}%)`;
        updateStats();
      }
    }

    /* -------------------------------------------------------------
       ADD ALBUM MODAL CONTROLLERS
       ------------------------------------------------------------- */
    function openAddAlbumModal() {
      if (isAddingAlbum) return;
      if (hasRecordedAlbumToday()) {
        alert("하루에 한 개의 앨범만 기록할 수 있습니다.\n오늘의 앨범은 이미 기록되었어요!");
        return;
      }

      uploadedCoverBase64 = null;
      document.getElementById("add-album-form").reset();
      document.getElementById("cover-preview-box").classList.remove("has-img");
      document.getElementById("cover-preview-img").src = "";
      setStarRating(5);

      const todayStr = getTodayLocalDateStr();
      const dateInput = document.getElementById("form-listen-date");
      dateInput.value = todayStr;
      dateInput.max = todayStr;

      document.getElementById("add-album-modal").classList.add("active");
    }

    function closeAddAlbumModal() {
      document.getElementById("add-album-modal").classList.remove("active");
    }

    function triggerFileInput() {
      document.getElementById("album-cover-file").click();
    }

    function handleCoverImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        alert("이미지 파일만 등록 가능합니다.");
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        uploadedCoverBase64 = event.target.result;
        const previewBox = document.getElementById("cover-preview-box");
        const previewImg = document.getElementById("cover-preview-img");
        previewImg.src = uploadedCoverBase64;
        previewBox.classList.add("has-img");
      };
      reader.readAsDataURL(file);
    }

    function setStarRating(rating) {
      selectedStarRating = rating;
      const stars = document.querySelectorAll("#rating-picker-container .star-btn");
      stars.forEach((star) => {
        const r = parseInt(star.getAttribute("data-rating"), 10);
        if (r <= rating) {
          star.classList.add("active");
        } else {
          star.classList.remove("active");
        }
      });
      document.getElementById("rating-score-display").textContent = `${rating}.0점`;
    }

    /* -------------------------------------------------------------
       3 & 3-1. RECORD SUBMIT & DUAL ANIMATION
       체크 버튼 누르면:
       1) LP판이 커버에 들어가는 애니메이션
       2) LP가 책장에 꽂히는 애니메이션 (등(옆) 형태로 꽂힘)
       ------------------------------------------------------------- */
    function handleAlbumSubmit(e) {
      e.preventDefault();
      if (isAddingAlbum) return;

      if (hasRecordedAlbumToday()) {
        alert("하루에 한 개의 앨범만 기록할 수 있습니다.\n오늘의 앨범은 이미 기록되었어요!");
        closeAddAlbumModal();
        return;
      }

      const title = document.getElementById("form-album-title").value.trim();
      const artist = document.getElementById("form-artist-name").value.trim();
      const bestTrack = document.getElementById("form-best-track").value.trim();
      const oneLiner = document.getElementById("form-one-liner").value.trim();
      const todayStr = getTodayLocalDateStr();
      let listenDate = document.getElementById("form-listen-date").value;
      if (!listenDate) listenDate = todayStr;

      if (listenDate > todayStr) {
        alert("미래 날짜의 앨범은 기록할 수 없습니다.");
        return;
      }

      if (albumsList.some(a => a.date === listenDate)) {
        alert("해당 날짜에는 이미 기록된 앨범이 있습니다.\n하루에 한 개의 앨범만 기록할 수 있어요!");
        return;
      }

      if (!title || !artist || !bestTrack || !oneLiner) {
        alert("모든 필수 항목을 입력해주세요.");
        return;
      }

      // 사진 추가하지 않았을 때 흰색 기본 이미지로 추가
      const coverUrl = uploadedCoverBase64 || getWhiteDefaultCoverSvg(title, artist);

      const newAlbum = {
        id: "lp_" + Date.now(),
        title,
        artist,
        bestTrack,
        rating: selectedStarRating,
        oneLiner,
        date: listenDate,
        coverUrl,
        createdAt: new Date().toISOString()
      };

      closeAddAlbumModal();
      playLpCreationTheater(newAlbum);
    }

    function playLpCreationTheater(album) {
      if (isAddingAlbum) return;
      isAddingAlbum = true;

      const theater = document.getElementById("lp-creation-theater");
      const assembly = document.getElementById("theater-lp-assembly");
      const discLabel = document.getElementById("theater-disc-label");
      const jacketImg = document.getElementById("theater-jacket-img");

      discLabel.src = album.coverUrl;
      jacketImg.src = album.coverUrl;

      theater.style.display = "flex";
      assembly.className = "theater-lp-assembly";
      assembly.style.transform = "";
      assembly.style.top = "";
      assembly.style.left = "";
      assembly.style.width = "";
      assembly.style.height = "";
      assembly.style.opacity = "";

      sfx.playSlideIn();
      requestAnimationFrame(() => {
        setTimeout(() => {
          assembly.classList.add("step-sliding-in");
        }, 100);
      });

      // 2단계: LP가 책장 해당 위치로 날아가 책장에 착 꽂힘
      setTimeout(() => {
        if (!currentUser) {
          theater.style.display = "none";
          assembly.className = "theater-lp-assembly";
          isAddingAlbum = false;
          return;
        }
        const nextTargetIndex = albumsList.length;
        const targetShelf = Math.floor(nextTargetIndex / 30);

        if (currentShelfIndex !== targetShelf) {
          currentShelfIndex = targetShelf;
          const wrapper = document.getElementById("bookshelf-slider-wrapper");
          wrapper.style.transform = `translateX(-${currentShelfIndex * 100}%)`;
        }

        const row = Math.floor((nextTargetIndex % 30) / 10);
        const col = (nextTargetIndex % 30) % 10;
        const targetSlotElem = document.getElementById(`slot-${targetShelf}-${row}-${col}`);

        if (targetSlotElem) {
          const rect = targetSlotElem.getBoundingClientRect();
          const currentAssemblyRect = assembly.getBoundingClientRect();

          const deltaX = rect.left + rect.width / 2 - (currentAssemblyRect.left + currentAssemblyRect.width / 2);
          const deltaY = rect.top + rect.height / 2 - (currentAssemblyRect.top + currentAssemblyRect.height / 2);
          const targetScale = rect.width / (currentAssemblyRect.width || 260);

          assembly.classList.add("step-flying-to-shelf");
          assembly.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(${targetScale}) rotateX(12deg)`;
        } else {
          assembly.style.transform = `translateY(220px) scale(0.3) rotateX(12deg)`;
          assembly.style.opacity = "0";
        }

        setTimeout(() => {
          try {
            if (!currentUser) {
              theater.style.display = "none";
              assembly.className = "theater-lp-assembly";
              return;
            }
            sfx.playSlotSnap();

            albumsList.push(album);
            saveUserAlbums();
            renderBookshelf();

            const newlyInsertedLp = document.getElementById(`lp-item-${album.id}`);
            if (newlyInsertedLp) {
              newlyInsertedLp.style.animation = "pulseSnap 0.6s ease";
            }

            theater.style.display = "none";
            assembly.className = "theater-lp-assembly";

            showToast(`'${album.title}' LP가 기록되었습니다!`);
          } finally {
            isAddingAlbum = false;
          }
        }, 800);

      }, 1300);
    }

    /* -------------------------------------------------------------
       4. DETAIL MODAL (기록 보기)
       ------------------------------------------------------------- */
    function openDetailModal(albumId) {
      const album = albumsList.find(a => a.id === albumId);
      if (!album) return;

      viewingAlbumId = albumId;

      document.getElementById("detail-cover-img").src = album.coverUrl;
      document.getElementById("detail-disc-label-img").src = album.coverUrl;
      const detailBadge = document.getElementById("detail-jacket-rating");
      if (detailBadge) detailBadge.textContent = "★ " + Number(album.rating).toFixed(1);
      document.getElementById("detail-album-title").textContent = album.title;
      document.getElementById("detail-artist-name").textContent = album.artist;
      document.getElementById("detail-best-track").textContent = album.bestTrack;
      document.getElementById("detail-rating").textContent = "★".repeat(album.rating) + ` ${Number(album.rating).toFixed(1)}`;
      document.getElementById("detail-date").textContent = album.date;
      document.getElementById("detail-one-liner").textContent = `"${album.oneLiner}"`;

      document.getElementById("detail-album-modal").classList.add("active");
    }

    function closeDetailModal() {
      document.getElementById("detail-album-modal").classList.remove("active");
      viewingAlbumId = null;
    }

    function deleteCurrentAlbum() {
      if (!viewingAlbumId) return;
      if (confirm("이 LP 기록을 책장에서 제거하시겠습니까?")) {
        albumsList = albumsList.filter(a => a.id !== viewingAlbumId);
        saveUserAlbums();
        renderBookshelf();
        closeDetailModal();
        showToast("LP 기록이 삭제되었습니다.");
      }
    }

    function addSampleRecordPrompt() {
      if (isAddingAlbum) return;
      if (hasRecordedAlbumToday()) {
        alert("하루에 한 개의 앨범만 기록할 수 있습니다.\n오늘의 앨범은 이미 기록되었어요!");
        return;
      }

      const sampleTitles = [
        { t: "Abbey Road", a: "The Beatles", b: "Come Together", r: 5, q: "시대가 지나도 빛을 잃지 않는 명반 중의 명반." },
        { t: "The Dark Side of the Moon", a: "Pink Floyd", b: "Time", r: 5, q: "음악이 철학이 될 수 있음을 증명하는 사운드스케이프." },
        { t: "To Pimp a Butterfly", a: "Kendrick Lamar", b: "Alright", r: 5, q: "묵직한 메시지와 재즈/힙합의 경이로운 융합." },
        { t: "Blonde", a: "Frank Ocean", b: "Nights", r: 5, q: "새벽녘 감정을 뒤흔드는 미니멀하고도 깊은 여운." },
        { t: "신인류의 사랑", a: "공중도둑", b: "쇠사슬", r: 5, q: "환상적인 질감의 사운드 콜라주." }
      ];
      const randomItem = sampleTitles[Math.floor(Math.random() * sampleTitles.length)];

      const newSample = {
        id: "lp_" + Date.now(),
        title: randomItem.t,
        artist: randomItem.a,
        bestTrack: randomItem.b,
        rating: randomItem.r,
        oneLiner: randomItem.q,
        date: getTodayLocalDateStr(),
        coverUrl: getWhiteDefaultCoverSvg(randomItem.t, randomItem.a),
        createdAt: new Date().toISOString()
      };

      playLpCreationTheater(newSample);
    }

    /* -------------------------------------------------------------
       HELPERS & UTILS
       ------------------------------------------------------------- */
    function showToast(msg) {
      const toast = document.getElementById("toast-bar");
      const msgSpan = document.getElementById("toast-message");
      msgSpan.textContent = msg;
      toast.classList.add("active");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("active");
      }, 2800);
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
